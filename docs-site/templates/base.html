<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ config.description }}">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B5472A'/%3E%3Cpath d='M18 40 32 18l14 22M24 32h16' fill='none' stroke='%23FBF7F2' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="{{ get_url(path='vendor/fraunces.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <script>try { const t = localStorage.getItem('a2a-docs-theme'); if (t) document.documentElement.dataset.theme = t } catch {}</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% set home = get_section(path="_index.md") %}
  <header class="bar">
    <a class="brand" href="{{ get_url(path='/', trailing_slash=true) }}"><span class="mark" aria-hidden="true">A2A</span><span>for Claude Code</span></a>
    <nav class="nav" aria-label="Documentation">
      <a href="{{ home.permalink | safe }}"{% if current_path == "/" %} aria-current="page"{% endif %}>{{ home.extra.nav }}</a>
      {% for p in home.pages %}<a href="{{ p.permalink | safe }}"{% if current_path == p.path %} aria-current="page"{% endif %}>{{ p.extra.nav }}</a>{% endfor %}
    </nav>
    <div class="actions">
      <a class="icon" href="https://github.com/fulgas/claude-a2a" aria-label="claude-a2a on GitHub" title="GitHub"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
      <button class="icon" id="theme" type="button" aria-label="Switch color theme" title="Switch color theme"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </header>
  {% block content %}{% endblock %}
  <footer class="foot">
    <p>MIT OR Apache-2.0 · <a href="https://github.com/fulgas/claude-a2a/issues/new/choose">Report a problem</a> · Built from <a href="https://github.com/fulgas/claude-a2a">fulgas/claude-a2a</a></p>
  </footer>
  <dialog id="zoom" aria-labelledby="zoom-title">
    <header class="zoom-bar">
      <h2 id="zoom-title">Diagram</h2>
      <div class="zoom-actions">
        <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out (−)">−</button>
        <output id="zoom-level" aria-live="polite">100%</output>
        <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in (+)">+</button>
        <button type="button" data-zoom="fit" title="Fit (0)">Fit</button>
        <button type="button" data-zoom="close" aria-label="Close" title="Close (Esc)">✕</button>
      </div>
    </header>
    <div id="zoom-canvas" tabindex="0"></div>
  </dialog>
  <script src="{{ get_url(path='vendor/mermaid.min.js') }}" defer></script>
  <script src="{{ get_url(path='site.js') }}" defer></script>
</body>
</html>
