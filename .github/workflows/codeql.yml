name: CodeQL

# Static analysis of the plugin's code (the bridge, the hooks module, the docs site's scripts) and of the
# workflows. Findings show under Security, Code scanning.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ javascript-typescript, actions ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # dist/ is the bundle of bridge/ and node_modules: analysing the source is enough.
          config: |
            paths-ignore:
              - dist
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
