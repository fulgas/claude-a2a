name: Release

# A release comes through a pull request. On every push to main, release-please keeps the release pull request up to
# date: the next version from the Conventional Commits since the last release, and its CHANGELOG.md entry. Merging it
# tags vX.Y.Z and publishes the GitHub Release; releases are immutable, and the plugin ships no assets, so there is no
# draft step. The release app's token is used so CI runs on the release pull request and the tag can be made under
# the tag ruleset. The bundle job keeps dist/ in the release pull request built from its source, as dist/ changes only
# there. Once a release exists, the provenance job rebuilds the bundle from the tag, checks it is the one committed,
# and signs SLSA build provenance for the files the plugin runs.

on:
  push:
    branches: [ main ]
  # Rerun by hand, when the release pull request has to be brought up to date without a new push to main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release pull request, tag and GitHub Release
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Only what release-please does: the release branch, tag and release, its pull request, and its labels.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The bundle is built only for a release: the release pull request gets dist/ rebuilt from its own source and lock
  # file, and the marketplace pointed at the tag it will make, in one commit, and only when either changed. The commit
  # is made through the API with the app's token, so GitHub signs it and CI runs on it.
  bundle:
    name: Bundle in the release pull request
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-26.04
    concurrency:
      group: release-bundle
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --label 'autorelease: pending' --state open \
            --json headRefName --jq '.[0].headRefName // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.branch }}
          persist-credentials: false
      - if: steps.pr.outputs.branch != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - if: steps.pr.outputs.branch != ''
        run: npm ci --ignore-scripts
      - if: steps.pr.outputs.branch != ''
        name: Rebuild dist/ and point the marketplace at the release's tag
        run: |
          npm run build
          node -e '
            const fs = require("node:fs")
            const file = ".claude-plugin/marketplace.json"
            const marketplace = JSON.parse(fs.readFileSync(file, "utf8"))
            const ref = `v${require("./package.json").version}`
            // Over HTTPS: a "github" source clones over SSH, which fails for anyone without a key on GitHub.
            const url = `https://github.com/${process.env.GITHUB_REPOSITORY}.git`
            marketplace.plugins[0].source = { source: "url", url, ref }
            fs.writeFileSync(file, `${JSON.stringify(marketplace, null, 2)}\n`)
          '
      - if: steps.pr.outputs.branch != ''
        name: Commit what changed to the release pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo "dist/ and the marketplace already match the release"
            exit 0
          fi
          api() { local route=$1; shift; gh api "repos/$GITHUB_REPOSITORY/$route" "$@"; }
          entries=$(for file in $changed; do
            sha=$(base64 -w0 "$file" | jq -Rs '{content: ., encoding: "base64"}' | api git/blobs --input - --jq .sha)
            jq -n --arg path "$file" --arg sha "$sha" '{path: $path, mode: "100644", type: "blob", sha: $sha}'
          done | jq -s .)
          tree=$(jq -n --arg base "$(git rev-parse 'HEAD^{tree}')" --argjson entries "$entries" \
            '{base_tree: $base, tree: $entries}' | api git/trees --input - --jq .sha)
          bot="${APP_SLUG}[bot]"
          id=$(gh api "users/$bot" --jq .id)
          version=$(node -p 'require("./package.json").version')
          message=$(printf 'build(release): bundle the bridge for v%s\n\nSigned-off-by: %s <%s+%s@users.noreply.github.com>\n' \
            "$version" "$bot" "$id" "$bot")
          commit=$(jq -n --arg message "$message" --arg tree "$tree" --arg parent "$(git rev-parse HEAD)" \
            '{message: $message, tree: $tree, parents: [$parent]}' | api git/commits --input - --jq .sha)
          # Not forced: if release-please moved the branch meanwhile, this fails and its next run rebuilds.
          api "git/refs/heads/$BRANCH" -X PATCH -f sha="$commit" --silent
          echo "committed $changed as $commit"

  provenance:
    name: Build provenance
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # The provenance is only true if the committed bundle is what the tagged source builds.
      - name: dist/ is what the tagged source builds
        run: |
          npm run build
          git diff --exit-code dist/
      # Verify with: gh attestation verify <file> --repo fulgas/claude-a2a
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/a2a.mjs
            hooks/register.ts
            .claude-plugin/plugin.json
