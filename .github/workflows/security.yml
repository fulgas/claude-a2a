name: Security

# Known vulnerabilities and supply-chain checks. What ships is dist/a2a.mjs, which bundles the bridge's
# dependencies, so those are what the audits gate; build and lint tools are still checked for tampering.

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Known vulnerabilities in the bridge's dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm ci --ignore-scripts
      # Every installed package is the one the registry signed, and those published with provenance match it.
      - name: Registry signatures and provenance
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Refuses a pull request that adds a dependency with a known vulnerability, or one under a licence
      # that cannot ship inside an MIT OR Apache-2.0 bundle.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  zizmor:
    name: Workflow audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Template injection, excessive permissions, unpinned actions, credential leaks in the workflows themselves.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
