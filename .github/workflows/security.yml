name: Security

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Only what is bundled into dist/a2a.mjs ships; build and lint tools do not.
      - name: Known vulnerabilities in the bridge's dependencies
        run: npm audit --omit=dev --audit-level=moderate
