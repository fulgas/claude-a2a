name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Claude Code that runs `claude plugin validate` and `claude plugin test`; neither needs a login.
  CLAUDE_CODE_VERSION: 2.1.312

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The bundle is committed, as installs run no npm install: it must be what the source builds.
      - name: dist/ matches the source
        run: |
          npm run build
          git diff --exit-code dist/
      - name: The bridge, end to end over JSON-RPC, HTTP+JSON and gRPC
        run: node --test bridge/a2a.test.mjs
      - name: The plugin's hooks, against the engine
        run: npx -y @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION} plugin test .

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome ci .
      - name: The plugin manifest and hooks module, as the engine reads them
        run: npx -y @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION} plugin validate .
