name: Scorecard

# OpenSSF Scorecard: how well the repository resists supply-chain attacks (pinned dependencies, branch
# protection, signed releases, token permissions and more). Results show under Security, Code scanning,
# and on https://scorecard.dev.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
